          text = replace_once(
              text,
              'if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);',
              'if (!requestAppPermissions()) {\n'
              '                RootFSInstaller.installIfNeeded(this);\n'
              '                FusionFallBootstrap.startWhenReady(this);\n'
              '            }',
              'MainActivity onCreate')
          text = replace_once(
              text,
              'RootFSInstaller.installIfNeeded(this);\n            }\n            else finish();',
              'RootFSInstaller.installIfNeeded(this);\n'
              '                FusionFallBootstrap.startWhenReady(this);\n'
              '            }\n            else finish();',
              'MainActivity permission callback')
          main_java.write_text(text, encoding='utf-8')

          s = strings_xml.read_text(encoding='utf-8')
          s, n = re.subn(r'<string name="app_name">.*?</string>',
                         '<string name="app_name">FusionFall Android</string>', s, count=1)
          if n != 1:
              raise RuntimeError('Could not patch app_name')
          strings_xml.write_text(s, encoding='utf-8')

          g = build_gradle.read_text(encoding='utf-8')
          if 'versionName "11.2"' in g:
              g = g.replace('versionName "11.2"', 'versionName "11.2-fusionfall-poc2"', 1)
          elif 'versionName' in g:
              g = re.sub(r'versionName\s+"[^"]+"', 'versionName "fusionfall-poc2"', g, count=1)
          else:
              raise RuntimeError('Could not patch versionName')
          build_gradle.write_text(g, encoding='utf-8')
          PYCODE

      - name: Verify patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Android' winlator-app/app/src/main/res/values/strings.xml
          grep -q 'FusionFallBootstrap.startWhenReady' winlator-app/app/src/main/java/com/winlator/MainActivity.java
          test -s winlator-app/app/src/main/java/com/winlator/FusionFallBootstrap.java

      - name: Build APK
        working-directory: winlator-app
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK }}
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/FusionFall-Android-POC2.apk
          sha256sum dist/FusionFall-Android-POC2.apk > dist/FusionFall-Android-POC2.apk.sha256
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Android-POC2
          path: |
            dist/FusionFall-Android-POC2.apk
            dist/FusionFall-Android-POC2.apk.sha256
          if-no-files-found: error
          retention-days: 30
