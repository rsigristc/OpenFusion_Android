      - name: Apply Retrobution POC4.4.1 mobile patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 poc4/apply_retrobution_poc4.py winlator-app

      - name: Verify POC4.4.1 patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Android POC4.4.1' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'Recordar contraseña e iniciar sesión automáticamente' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'AndroidKeyStore' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'adaptive mobile interaction layer' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'gamepad_right_stick_camera' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'controls_auto_fade' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'startRenderPump' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'fusionFallSendMouseButton' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'Balanced · 1280×720 / 45 FPS' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'show_performance_hud' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'fusionfall_mobile_controls' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallOnRenderedFrame' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallSetPerformanceHudEnabled' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'setPerformanceHudEnabled(activity, false)' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          ! grep -q 'activity.fusionFallSetPerformanceHudEnabled' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'fusionFallOnRenderedFrame' winlator-app/app/src/main/java/com/winlator/renderer/GLRenderer.java
          grep -q 'FusionFall Retrobution Mobile' winlator-app/app/src/main/res/values/strings.xml

      - name: Build APK
        shell: bash
        run: |
          set -uo pipefail
          cd winlator-app
          chmod +x gradlew
          find app/src/main/res -type f -name "*.bak.fusionfall-poc4*" -print -delete || true
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo '================ BUILD ERROR SUMMARY ================'
            grep -nEi 'error:|FAILURE:|Execution failed|Caused by:|cannot find symbol|incompatible types|expected' ../build.log | tail -220 || true
            echo '====================================================='
            exit "$status"
          fi

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
