      - name: Apply Retrobution POC4.7 patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 poc4_7/apply_retrobution_poc4.py winlator-app

      - name: Verify POC4.7 patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Android POC4.7' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'Controles móviles POC4.7' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'fusionfall_force_fullscreen' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'fusionFallForceFullscreen' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'setForceWindowsFullscreen' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallMoveMouseRelative' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallSetPerformanceHudEnabled' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'frameRating.bringToFront' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'frameRating.run' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallOnRenderedFrame' winlator-app/app/src/main/java/com/winlator/renderer/GLRenderer.java
          grep -q 'show_nano_shortcuts' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'auto_hide_controls_gamepad' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'camera_sensitivity_x' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'camera_sensitivity_y' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'camera_invert_y' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q "applicationId 'com.retrobution.fusionfall.android'" winlator-app/app/build.gradle
          grep -q 'versionCode 470' winlator-app/app/build.gradle
          grep -q 'versionName "0.4.7"' winlator-app/app/build.gradle
          test "$(grep -c 'minifyEnabled false' winlator-app/app/build.gradle)" -ge 2
          grep -q 'FUSIONFALL_KEYSTORE_PATH' winlator-app/app/build.gradle
          grep -q 'android:authorities="${applicationId}.FileProvider"' winlator-app/app/src/main/AndroidManifest.xml
          grep -q 'activity.getPackageName() + ".FileProvider"' winlator-app/app/src/main/java/com/winlator/core/FileUtils.java
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' winlator-app/app/src/main/AndroidManifest.xml
          test -s winlator-app/app/src/main/res/drawable-nodpi/retrobution_icon_foreground.png
          test -s winlator-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Prepare persistent release signing key
        shell: bash
        env:
          RETROBUTION_KEYSTORE_BASE64: ${{ secrets.RETROBUTION_KEYSTORE_BASE64 }}
          RETROBUTION_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          RETROBUTION_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          RETROBUTION_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RETROBUTION_KEYSTORE_BASE64 RETROBUTION_KEYSTORE_PASSWORD RETROBUTION_KEY_ALIAS RETROBUTION_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 2; fi
          SIGN_DIR="$RUNNER_TEMP/fusionfall-retrobution-signing"
          mkdir -p "$SIGN_DIR"
          KS="$SIGN_DIR/retrobution-release.jks"
          printf '%s' "$RETROBUTION_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KS"
          chmod 600 "$KS"
          test -s "$KS"
          keytool -list -keystore "$KS" -storepass "$RETROBUTION_KEYSTORE_PASSWORD" -alias "$RETROBUTION_KEY_ALIAS" >/dev/null
          echo "FUSIONFALL_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build production release APK and AAB
        shell: bash
        env:
          FUSIONFALL_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          FUSIONFALL_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          FUSIONFALL_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          cd winlator-app
          chmod +x gradlew
          find app/src/main/res -type f -name "*.bak.fusionfall-poc4*" -print -delete || true
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo '================ BUILD ERROR SUMMARY ================
            grep -nEi 'error:|FAILURE:|Execution failed|Caused by:|cannot find symbol|incompatible types|expected|signing|AAPT' ../build.log | tail -360 || true
            echo '====================================================='
            exit "$status"
          fi

      - name: Verify production identity and APK signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee dist/FusionFall-Retrobution-Android-POC4.7-badging.txt
          grep -q "package: name='com.retrobution.fusionfall.android' versionCode='470' versionName='0.4.7'" dist/FusionFall-Retrobution-Android-POC4.7-badging.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNING_REPORT="dist/FusionFall-Retrobution-Android-POC4.7-signing.txt"
          if ! "$APKSIGNER" verify --min-sdk-version 26 "$APK"; then
            echo "::error::APK signature verification failed for Android API 26+."
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$APK" 2>&1 || true
            exit 1
          fi
          set +e
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$APK" > "$SIGNING_REPORT" 2>&1
          REPORT_STATUS=$?
          set -e
          cat "$SIGNING_REPORT"
          EXPECTED_CERT_SHA256="8cbcd76a1e1139ca1c763ee98f528b8e4a7790ed4806c2f441d110818694da0f"
          ACTUAL_CERT_SHA256="$(sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' "$SIGNING_REPORT" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$ACTUAL_CERT_SHA256"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected APK signing certificate. Expected $EXPECTED_CERT_SHA256, got $ACTUAL_CERT_SHA256"
            exit 1
          fi
          if ! grep -Eq '^Verified using v(2|3|3\.1) scheme .*: true$' "$SIGNING_REPORT"; then
            echo "::error::No verified APK Signature Scheme v2/v3/v3.1 was reported."
            exit 1
          fi
          if [ "$REPORT_STATUS" -ne 0 ]; then echo "::warning::Verbose certificate report exited $REPORT_STATUS after independent verification succeeded."; fi
          echo "Retrobution POC4.7 identity/signature verified: $ACTUAL_CERT_SHA256"

      - name: Collect release artifacts and checksums
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find winlator-app/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          AAB="$(find winlator-app/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" dist/FusionFall-Retrobution-Android-POC4.7.apk
          cp "$AAB" dist/FusionFall-Retrobution-Android-POC4.7.aab
          sha256sum dist/FusionFall-Retrobution-Android-POC4.7.apk > dist/FusionFall-Retrobution-Android-POC4.7.apk.sha256
          sha256sum dist/FusionFall-Retrobution-Android-POC4.7.aab > dist/FusionFall-Retrobution-Android-POC4.7.aab.sha256
          cat dist/FusionFall-Retrobution-Android-POC4.7.apk.sha256
          cat dist/FusionFall-Retrobution-Android-POC4.7.aab.sha256

      - name: Upload POC4.7 production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Retrobution-Android-POC4.7
          path: |
            dist/FusionFall-Retrobution-Android-POC4.7.apk
            dist/FusionFall-Retrobution-Android-POC4.7.apk.sha256
            dist/FusionFall-Retrobution-Android-POC4.7.aab
            dist/FusionFall-Retrobution-Android-POC4.7.aab.sha256
            dist/FusionFall-Retrobution-Android-POC4.7-signing.txt
            dist/FusionFall-Retrobution-Android-POC4.7-badging.txt
          if-no-files-found: error
