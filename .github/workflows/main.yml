name: Build FusionFall Retrobution Android POC4.9.2 Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - poc4.9.2-diagnostics
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  WINLATOR_COMMIT: 4f55d117fff1542944e5b91f433470445160ce08
  ANDROID_NDK: '24.0.8215888'
  ANDROID_CMAKE: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK / NDK / CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${{ env.ANDROID_NDK }}" \
            "cmake;${{ env.ANDROID_CMAKE }}"

      - name: Fetch audited Winlator snapshot
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf winlator-app poc4 dist build.log
          git init winlator-app
          git -C winlator-app remote add origin https://github.com/brunodev85/winlator-app.git
          git -C winlator-app fetch --depth=1 origin "${{ env.WINLATOR_COMMIT }}"
          git -C winlator-app checkout --detach FETCH_HEAD
          test "$(git -C winlator-app rev-parse HEAD)" = "${{ env.WINLATOR_COMMIT }}"

