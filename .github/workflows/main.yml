      - name: Apply Retrobution POC4.5 mobile patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 poc4/apply_retrobution_poc4.py winlator-app

      - name: Verify POC4.5 patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Android POC4.5' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'Recordar contraseña e iniciar sesión automáticamente' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'AndroidKeyStore' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'POC4.5 mobile-controls-v2 interaction layer' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'class CameraTouchView extends View' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'class NativeHudTouchView extends View' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'setUiMode(activity, !uiMode)' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'touch_camera_enabled' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'native_hud_touch_enabled' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'touchAttack = true' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'startRenderPump' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'Balanced · 1280×720 / 45 FPS' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'gamepad_right_stick_camera' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'fusionfall_mobile_controls' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallSetCursorVisible' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallSetPerformanceHudEnabled' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallOnRenderedFrame' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'fusionFallOnRenderedFrame' winlator-app/app/src/main/java/com/winlator/renderer/GLRenderer.java
          ! grep -q 'activity.fusionFallSetPerformanceHudEnabled' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'versionName "11.2-fusionfall-poc4.5-mobile"' winlator-app/app/build.gradle
          grep -q 'FusionFall Retrobution Mobile' winlator-app/app/src/main/res/values/strings.xml

      - name: Build APK
        shell: bash
        run: |
          set -uo pipefail
          cd winlator-app
          chmod +x gradlew
          find app/src/main/res -type f -name "*.bak.fusionfall-poc4*" -print -delete || true
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo '================ BUILD ERROR SUMMARY ================'
            grep -nEi 'error:|FAILURE:|Execution failed|Caused by:|cannot find symbol|incompatible types|expected' ../build.log | tail -260 || true
            echo '====================================================='
            exit "$status"
          fi

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/FusionFall-Retrobution-POC4.5.apk
          sha256sum dist/FusionFall-Retrobution-POC4.5.apk > dist/FusionFall-Retrobution-POC4.5.apk.sha256
          cat dist/FusionFall-Retrobution-POC4.5.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Retrobution-POC4.5
          path: |
            dist/FusionFall-Retrobution-POC4.5.apk
            dist/FusionFall-Retrobution-POC4.5.apk.sha256
          if-no-files-found: error
