          grep -q 'fusionFallSetPerformanceHudEnabled' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'getMethod(' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q '@androidx.annotation.Keep' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'frameRating.bringToFront' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'frameRating.run()' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'runOnUiThread' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'getRenderer().toggleFullscreen()' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          ! grep -q 'setForceWindowsFullscreen(true)' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q "applicationId 'com.winlator'" winlator-app/app/build.gradle
          ! grep -q "applicationId 'com.retrobution.fusionfall.android'" winlator-app/app/build.gradle
          grep -q 'versionCode 483' winlator-app/app/build.gradle
          grep -q 'versionName "0.4.8.3"' winlator-app/app/build.gradle
          grep -q '"TARGET", "target"' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'Action.KEY_Z' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'KeyEvent.KEYCODE_Z' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'AndroidKeyStore' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'addNativeNanoHotspots' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'show_nano_shortcuts' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'auto_hide_touch_on_gamepad' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'camera_sensitivity_x' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'camera_sensitivity_y' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
