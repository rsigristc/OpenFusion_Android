      - name: Apply Retrobution POC4.6.3 patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 poc4/apply_retrobution_poc4.py winlator-app

      - name: Verify POC4.6.3 patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Android POC4.6.3' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'POC4.6.3 mobile-controls-v2 interaction layer' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'addNativeNanoHotspots' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'Recordar contraseña e iniciar sesión automáticamente' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'AndroidKeyStore' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'Launcher Android nativo · Controles móviles POC4.6.3' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'loginInFlight' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'Inicio automático cancelado por interacción manual' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          ! grep -q 'username.setEnabled(false)' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          ! grep -q 'password.setEnabled(false)' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'fusionFallOnRenderedFrame' winlator-app/app/src/main/java/com/winlator/renderer/GLRenderer.java
          grep -q 'versionCode 463' winlator-app/app/build.gradle
          grep -q 'versionName "11.2-fusionfall-poc4.6.3-signed"' winlator-app/app/build.gradle
          grep -q 'FUSIONFALL_KEYSTORE_PATH' winlator-app/app/build.gradle
          grep -q 'signingConfigs' winlator-app/app/build.gradle
          grep -q 'if (fusionFallSigningReady) signingConfig signingConfigs.release' winlator-app/app/build.gradle
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' winlator-app/app/src/main/AndroidManifest.xml
          grep -q 'retrobution_icon_background' winlator-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s winlator-app/app/src/main/res/drawable-nodpi/retrobution_icon_foreground.png
          test -s winlator-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Prepare persistent release signing key
        shell: bash
        env:
          RETROBUTION_KEYSTORE_BASE64: ${{ secrets.RETROBUTION_KEYSTORE_BASE64 }}
          RETROBUTION_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          RETROBUTION_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          RETROBUTION_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RETROBUTION_KEYSTORE_BASE64 RETROBUTION_KEYSTORE_PASSWORD RETROBUTION_KEY_ALIAS RETROBUTION_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the four RETROBUTION_* repository secrets before building POC4.6.3."
            exit 2
          fi

          SIGN_DIR="$RUNNER_TEMP/fusionfall-retrobution-signing"
          mkdir -p "$SIGN_DIR"
          KS="$SIGN_DIR/retrobution-release.jks"
          printf '%s' "$RETROBUTION_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KS"
          chmod 600 "$KS"
          test -s "$KS"
          keytool -list \
            -keystore "$KS" \
            -storepass "$RETROBUTION_KEYSTORE_PASSWORD" \
            -alias "$RETROBUTION_KEY_ALIAS" >/dev/null
          echo "FUSIONFALL_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "Release keystore loaded and alias validated."

      - name: Build signed debug-compatible APK
        shell: bash
        env:
          FUSIONFALL_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          FUSIONFALL_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          FUSIONFALL_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          cd winlator-app
          chmod +x gradlew
          find app/src/main/res -type f -name "*.bak.fusionfall-poc4*" -print -delete || true
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo '================ BUILD ERROR SUMMARY ================'
            grep -nEi 'error:|FAILURE:|Execution failed|Caused by:|cannot find symbol|incompatible types|expected|signing' ../build.log | tail -320 || true
            echo '====================================================='
            exit "$status"
          fi

      - name: Verify APK signature and certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNING_REPORT="dist/FusionFall-Retrobution-POC4.6.3-signing.txt"

          # The app's real minSdk is 26. Passing it explicitly avoids apksigner
          # treating an absent v1/JAR signature as required on older Android APIs.
          echo "Running cryptographic APK verification for minSdk 26..."
          if ! "$APKSIGNER" verify --min-sdk-version 26 "$APK"; then
            echo "::error::APK signature verification failed for Android API 26+."
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$APK" 2>&1 || true
            exit 1
          fi

          # Generate a human-readable certificate report. Do not let this diagnostic
          # command abort the job before we can validate the certificate ourselves.
          set +e
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$APK" > "$SIGNING_REPORT" 2>&1
          REPORT_STATUS=$?
          set -e
          cat "$SIGNING_REPORT"

          EXPECTED_CERT_SHA256="8cbcd76a1e1139ca1c763ee98f528b8e4a7790ed4806c2f441d110818694da0f"
          ACTUAL_CERT_SHA256="$(sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' "$SIGNING_REPORT" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"

          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            echo "::error::Could not parse the signer certificate SHA-256 digest from apksigner output."
            exit 1
          fi

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK was signed with an unexpected certificate."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          # Require a modern signature scheme accepted by Android 8+ (our minSdk is 26).
          if ! grep -Eq '^Verified using v(2|3|3\.1) scheme .*: true$' "$SIGNING_REPORT"; then
            echo "::error::No verified APK Signature Scheme v2/v3/v3.1 was reported."
            exit 1
          fi

          if [ "$REPORT_STATUS" -ne 0 ]; then
            echo "::warning::Verbose apksigner report returned status $REPORT_STATUS, but the independent cryptographic verification passed and the Retrobution certificate matches."
          fi

          echo "Retrobution persistent-signed APK verified successfully."
          echo "Certificate SHA-256: $ACTUAL_CERT_SHA256"

      - name: Collect signed APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find winlator-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/FusionFall-Retrobution-POC4.6.3-signed.apk
          sha256sum dist/FusionFall-Retrobution-POC4.6.3-signed.apk > dist/FusionFall-Retrobution-POC4.6.3-signed.apk.sha256
          cat dist/FusionFall-Retrobution-POC4.6.3-signed.apk.sha256
          echo
          cat dist/FusionFall-Retrobution-POC4.6.3-signing.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Retrobution-POC4.6.3-Signed
          path: |
