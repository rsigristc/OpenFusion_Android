              'ICAgICBNQUlOLnBvc3QoKCkgLT4gVG9hc3QubWFrZVRleHQoYWN0aXZpdHksIG1lc3NhZ2UsIFRvYXN0LkxFTkdUSF9MT05H'
              'KS5zaG93KCkpOwogICAgfQoKICAgIHByaXZhdGUgc3RhdGljIHZvaWQgZmFpbChNYWluQWN0aXZpdHkgYWN0aXZpdHksIFN0'
              'cmluZyBtZXNzYWdlLCBFeGNlcHRpb24gZSkgewogICAgICAgIGlmIChlICE9IG51bGwpIExvZy5lKFRBRywgbWVzc2FnZSwg'
              'ZSk7CiAgICAgICAgU3RyaW5nIGRldGFpbCA9IGUgIT0gbnVsbCAmJiBlLmdldE1lc3NhZ2UoKSAhPSBudWxsID8gIlxuIiAr'
              'IGUuZ2V0TWVzc2FnZSgpIDogIiI7CiAgICAgICAgc2hvdyhhY3Rpdml0eSwgbWVzc2FnZSArIGRldGFpbCk7CiAgICB9Cgog'
              'ICAgcHJpdmF0ZSBzdGF0aWMgZmluYWwgY2xhc3MgTGF1bmNoRGF0YSB7CiAgICAgICAgZmluYWwgU3RyaW5nIGV4ZWNBcmdz'
              'OwogICAgICAgIGZpbmFsIFN0cmluZyBlbnZWYXJzOwogICAgICAgIGZpbmFsIFN0cmluZyB2ZXJzaW9uVXVpZDsKCiAgICAg'
              'ICAgTGF1bmNoRGF0YShTdHJpbmcgZXhlY0FyZ3MsIFN0cmluZyBlbnZWYXJzLCBTdHJpbmcgdmVyc2lvblV1aWQpIHsKICAg'
              'ICAgICAgICAgdGhpcy5leGVjQXJncyA9IGV4ZWNBcmdzOwogICAgICAgICAgICB0aGlzLmVudlZhcnMgPSBlbnZWYXJzOwog'
              'ICAgICAgICAgICB0aGlzLnZlcnNpb25VdWlkID0gdmVyc2lvblV1aWQ7CiAgICAgICAgfQogICAgfQp9Cg=='
          )
          launcher_dst.write_bytes(base64.b64decode(launcher_b64))

          text = main_java.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'if (!requestAppPermissions()) RootFSInstaller.installIfNeeded(this);',
              'if (!requestAppPermissions()) {\n'
              '                RootFSInstaller.installIfNeeded(this);\n'
              '                FusionFallRetrobution.startWhenReady(this);\n'
              '            }',
              'MainActivity onCreate')
          text = replace_once(
              text,
              'RootFSInstaller.installIfNeeded(this);\n            }\n            else finish();',
              'RootFSInstaller.installIfNeeded(this);\n'
              '                FusionFallRetrobution.startWhenReady(this);\n'
              '            }\n            else finish();',
              'MainActivity permission callback')
          main_java.write_text(text, encoding='utf-8')

          x = xserver_java.read_text(encoding='utf-8')
          x = replace_once(
              x,
              'execPath = WineUtils.unixToDOSPath(intent.getStringExtra("exec_path"), container);',
              'execPath = WineUtils.unixToDOSPath(intent.getStringExtra("exec_path"), container);\n'
              '                String intentExecArgs = intent.getStringExtra("exec_args");\n'
              '                if (intentExecArgs != null && !intentExecArgs.isEmpty()) execArgs = " " + intentExecArgs;',
              'XServer exec_args')
          x = replace_once(
              x,
              'envVars.putAll(container.getEnvVars());',
              'envVars.putAll(container.getEnvVars());\n'
              '            String intentEnvVars = getIntent().getStringExtra("env_vars");\n'
              '            if (intentEnvVars != null && !intentEnvVars.isEmpty()) envVars.putAll(new EnvVars(intentEnvVars));',
              'XServer env_vars')
          xserver_java.write_text(x, encoding='utf-8')

          s = strings_xml.read_text(encoding='utf-8')
          s, n = re.subn(r'<string name="app_name">.*?</string>',
                         '<string name="app_name">FusionFall Retrobution</string>', s, count=1)
          if n != 1:
              raise RuntimeError('Could not patch app_name')
          strings_xml.write_text(s, encoding='utf-8')

          g = build_gradle.read_text(encoding='utf-8')
          if 'versionName "11.2"' in g:
              g = g.replace('versionName "11.2"', 'versionName "11.2-fusionfall-poc3.1-retrobution"', 1)
          elif 'versionName' in g:
              g = re.sub(r'versionName\s+"[^"]+"', 'versionName "fusionfall-poc3-retrobution"', g, count=1)
          else:
              raise RuntimeError('Could not patch versionName')
          build_gradle.write_text(g, encoding='utf-8')
          PYCODE

      - name: Verify POC3 patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Retrobution' winlator-app/app/src/main/res/values/strings.xml
          grep -q 'FusionFallRetrobution.startWhenReady' winlator-app/app/src/main/java/com/winlator/MainActivity.java
          grep -q 'exec_args' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'env_vars' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'api.ffretrobution.net' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'ffrunner.exe' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          ! grep -q 'findLauncherExe' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java

      - name: Build APK
        working-directory: winlator-app
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK }}
        run: |
          set -euxo pipefail
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug 2>&1 | tee ../gradle-build.log
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GRADLE_STATUS" -ne 0 ]; then
            echo
            echo "================ BUILD ERROR SUMMARY ================"
            grep -nE "(^|[[:space:]])error:|FAILURE:|What went wrong:|Execution failed for task|Caused by:" ../gradle-build.log | head -n 120 || true
            echo "====================================================="
            exit "$GRADLE_STATUS"
          fi

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/FusionFall-Retrobution-POC3.1.apk
          sha256sum dist/FusionFall-Retrobution-POC3.1.apk > dist/FusionFall-Retrobution-POC3.1.apk.sha256
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Retrobution-POC3.1
          path: |
            dist/FusionFall-Retrobution-POC3.1.apk
            dist/FusionFall-Retrobution-POC3.1.apk.sha256
          if-no-files-found: error
          retention-days: 30
