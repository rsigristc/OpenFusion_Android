          data = base64.b64decode(encoded)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall(root)
          PYCODE
          chmod +x poc4/apply_retrobution_poc4.py
          python3 -m py_compile poc4/apply_retrobution_poc4.py

      - name: Apply Retrobution POC4.8.3 camera vertical hotfix
        shell: bash
        run: |
          set -euxo pipefail
          python3 poc4/apply_retrobution_poc4.py winlator-app

      - name: Verify POC4.8.3 stable runtime and camera patch
        shell: bash
