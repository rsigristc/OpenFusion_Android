      - name: Apply Retrobution POC4.7.3 recovery patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 poc4/apply_retrobution_poc4.py winlator-app

      - name: Verify recovery baseline patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Android POC4.7.3' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'POC4.7.3 recovery mobile-controls-v2 interaction layer' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'Launcher Android nativo · Controles móviles POC4.7.3' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'fusionfall_force_fullscreen' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'fusionFallSetPerformanceHudEnabled' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'frameRating.bringToFront' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'frameRating.run()' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'setForceWindowsFullscreen(true)' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'xServerView.queueEvent(this::updateScene)' winlator-app/app/src/main/java/com/winlator/renderer/GLRenderer.java
          grep -q "applicationId 'com.winlator'" winlator-app/app/build.gradle
          ! grep -q "applicationId 'com.retrobution.fusionfall.android'" winlator-app/app/build.gradle
          grep -q 'versionCode 473' winlator-app/app/build.gradle
          grep -q 'versionName "0.4.7.3"' winlator-app/app/build.gradle
          grep -q 'AndroidKeyStore' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'addNativeNanoHotspots' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' winlator-app/app/src/main/AndroidManifest.xml
          test -s winlator-app/app/src/main/res/drawable-nodpi/retrobution_icon_foreground.png

      - name: Prepare persistent Retrobution signing key
        shell: bash
        env:
          RETROBUTION_KEYSTORE_BASE64: ${{ secrets.RETROBUTION_KEYSTORE_BASE64 }}
          RETROBUTION_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          RETROBUTION_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          RETROBUTION_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RETROBUTION_KEYSTORE_BASE64 RETROBUTION_KEYSTORE_PASSWORD RETROBUTION_KEY_ALIAS RETROBUTION_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi
          SIGN_DIR="$RUNNER_TEMP/fusionfall-retrobution-signing"
          mkdir -p "$SIGN_DIR"
          KS="$SIGN_DIR/retrobution-release.jks"
          printf '%s' "$RETROBUTION_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KS"
          chmod 600 "$KS"
          test -s "$KS"
          keytool -list -keystore "$KS" -storepass "$RETROBUTION_KEYSTORE_PASSWORD" -alias "$RETROBUTION_KEY_ALIAS" >/dev/null
          echo "FUSIONFALL_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed known-good debug runtime
        shell: bash
        env:
          FUSIONFALL_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          FUSIONFALL_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          FUSIONFALL_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          cd winlator-app
          chmod +x gradlew
          find app/src/main/res -type f -name "*.bak.fusionfall-poc4*" -print -delete || true
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo "================ APK BUILD ERROR SUMMARY ================"
            grep -nEi 'error:|FAILURE:|Execution failed|Caused by:|cannot find symbol|incompatible types|expected|signing|AAPT' ../build.log | tail -360 || true
            echo "================ LAST 180 LOG LINES ======================"
            tail -180 ../build.log || true
            echo "==========================================================="
            exit "$status"
          fi

      - name: Verify package identity and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee dist/FusionFall-Retrobution-POC4.7.3-badging.txt
          grep -q "package: name='com.winlator' versionCode='473' versionName='0.4.7.3'" dist/FusionFall-Retrobution-POC4.7.3-badging.txt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --min-sdk-version 26 "$APK"

          SIGNING_REPORT="dist/FusionFall-Retrobution-POC4.7.3-signing.txt"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$APK" > "$SIGNING_REPORT" 2>&1 || true
          cat "$SIGNING_REPORT"

          EXPECTED_CERT_SHA256="8cbcd76a1e1139ca1c763ee98f528b8e4a7790ed4806c2f441d110818694da0f"
          ACTUAL_CERT_SHA256="$(sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' "$SIGNING_REPORT" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Collect recovery APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find winlator-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" dist/FusionFall-Retrobution-POC4.7.3-recovery.apk
          sha256sum dist/FusionFall-Retrobution-POC4.7.3-recovery.apk > dist/FusionFall-Retrobution-POC4.7.3-recovery.apk.sha256
          cat dist/FusionFall-Retrobution-POC4.7.3-recovery.apk.sha256

      - name: Upload recovery APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Retrobution-POC4.7.3-Recovery
          path: |
            dist/FusionFall-Retrobution-POC4.7.3-recovery.apk
            dist/FusionFall-Retrobution-POC4.7.3-recovery.apk.sha256
            dist/FusionFall-Retrobution-POC4.7.3-signing.txt
            dist/FusionFall-Retrobution-POC4.7.3-badging.txt
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Retrobution-POC4.7.3-build-log
          path: build.log
          if-no-files-found: ignore
