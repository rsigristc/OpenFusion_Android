      - name: Apply Retrobution POC4.3 mobile patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 poc4/apply_retrobution_poc4.py winlator-app

      - name: Verify POC4.3 patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Android POC4.3' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'adaptive mobile interaction layer' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'gamepad_right_stick_camera' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'controls_auto_fade' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'Balanced · 1280×720 / 45 FPS' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'show_performance_hud' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'fusionfall_mobile_controls' winlator-app/app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'FusionFall Retrobution Mobile' winlator-app/app/src/main/res/values/strings.xml

      - name: Build APK
        shell: bash
        run: |
          set -uo pipefail
          cd winlator-app
          chmod +x gradlew
          find app/src/main/res -type f -name "*.bak.fusionfall-poc4*" -print -delete || true
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo '================ BUILD ERROR SUMMARY ================'
            grep -nEi 'error:|FAILURE:|Execution failed|Caused by:|cannot find symbol|incompatible types|expected' ../build.log | tail -220 || true
            echo '====================================================='
            exit "$status"
          fi

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/FusionFall-Retrobution-POC4.3.apk
          sha256sum dist/FusionFall-Retrobution-POC4.3.apk > dist/FusionFall-Retrobution-POC4.3.apk.sha256
          cat dist/FusionFall-Retrobution-POC4.3.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Retrobution-POC4.3
          path: |
            dist/FusionFall-Retrobution-POC4.3.apk
            dist/FusionFall-Retrobution-POC4.3.apk.sha256
          if-no-files-found: error
          retention-days: 30
