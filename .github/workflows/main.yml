name: Build OpenFusion Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_NDK: '24.0.8215888'
  ANDROID_CMAKE: '3.22.1'
  APP_VERSION: '0.5.6-beta'
  APP_VERSION_CODE: '506'
  APK_BASENAME: 'OpenFusion-Android-v0.5.6-beta'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK / NDK / CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${{ env.ANDROID_NDK }}" \
            "cmake;${{ env.ANDROID_CMAKE }}"

      - name: Verify public source layout
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s NOTICE
          test -s scripts/build.py
          test -s patches/winlator-4f55d11.patch
          test -s android-overlay/src/main/java/com/winlator/FusionFallRetrobution.java
          ! grep -R -nE 'base64\.b64decode\(encoded\)|tarfile\.open' .github scripts

      - name: Prepare persistent release signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RETROBUTION_KEYSTORE_BASE64: ${{ secrets.RETROBUTION_KEYSTORE_BASE64 }}
          RETROBUTION_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          RETROBUTION_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          RETROBUTION_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RETROBUTION_KEYSTORE_BASE64 RETROBUTION_KEYSTORE_PASSWORD RETROBUTION_KEY_ALIAS RETROBUTION_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi
          SIGN_DIR="$RUNNER_TEMP/openfusion-android-signing"
          mkdir -p "$SIGN_DIR"
          KS="$SIGN_DIR/release.jks"
          printf '%s' "$RETROBUTION_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KS"
          chmod 600 "$KS"
          test -s "$KS"
          keytool -list -keystore "$KS" -storepass "$RETROBUTION_KEYSTORE_PASSWORD" -alias "$RETROBUTION_KEY_ALIAS" >/dev/null
          echo "FUSIONFALL_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build with the public developer script
        shell: bash
        env:
          FUSIONFALL_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          FUSIONFALL_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          FUSIONFALL_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          python3 scripts/build.py --work-dir .build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo "================ APK BUILD ERROR SUMMARY ================"
            grep -nEi 'error:|FAILURE:|Execution failed|Caused by:|cannot find symbol|incompatible types|expected|signing|AAPT|R8|ProGuard|BUILD FAILED' build.log | tail -420 || true
            echo "================ LAST 180 LOG LINES ======================"
            tail -180 build.log || true
            echo "==========================================================="
            exit "$status"
          fi

      - name: Verify package identity and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find .build/winlator-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee "dist/${APK_BASENAME}-badging.txt"
          grep -q "package: name='com.winlator' versionCode='${APP_VERSION_CODE}' versionName='${APP_VERSION}'" "dist/${APK_BASENAME}-badging.txt"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --min-sdk-version 26 "$APK"

          SIGNING_REPORT="dist/${APK_BASENAME}-signing.txt"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$APK" > "$SIGNING_REPORT" 2>&1 || true
          cat "$SIGNING_REPORT"

          EXPECTED_CERT_SHA256="8cbcd76a1e1139ca1c763ee98f528b8e4a7790ed4806c2f441d110818694da0f"
          ACTUAL_CERT_SHA256="$(sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' "$SIGNING_REPORT" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$ACTUAL_CERT_SHA256"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          else
            echo "Pull request build uses an ephemeral debug key: $ACTUAL_CERT_SHA256"
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find .build/winlator-app/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" "dist/${APK_BASENAME}.apk"
          sha256sum "dist/${APK_BASENAME}.apk" > "dist/${APK_BASENAME}.apk.sha256"
          cat "dist/${APK_BASENAME}.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenFusion-Android-${{ env.APP_VERSION }}
          path: |
            dist/${{ env.APK_BASENAME }}.apk
            dist/${{ env.APK_BASENAME }}.apk.sha256
            dist/${{ env.APK_BASENAME }}-signing.txt
            dist/${{ env.APK_BASENAME }}-badging.txt
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenFusion-Android-${{ env.APP_VERSION }}-build-log
          path: build.log
          if-no-files-found: ignore
