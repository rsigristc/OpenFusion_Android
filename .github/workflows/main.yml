      - name: Apply Retrobution POC4.6 patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 poc4/apply_retrobution_poc4.py winlator-app

      - name: Verify POC4.6 patch
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'FusionFall Android POC4.6' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'POC4.6 mobile-controls-v2 interaction layer' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'addNativeNanoHotspots' winlator-app/app/src/main/java/com/winlator/FusionFallMobileControls.java
          grep -q 'Recordar contraseña e iniciar sesión automáticamente' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'AndroidKeyStore' winlator-app/app/src/main/java/com/winlator/FusionFallRetrobution.java
          grep -q 'fusionFallOnRenderedFrame' winlator-app/app/src/main/java/com/winlator/renderer/GLRenderer.java
          grep -q 'versionCode 46' winlator-app/app/build.gradle
          grep -q 'versionName "11.2-fusionfall-poc4.6-release"' winlator-app/app/build.gradle
          grep -q 'FUSIONFALL_KEYSTORE_PATH' winlator-app/app/build.gradle
          grep -q 'signingConfigs' winlator-app/app/build.gradle
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' winlator-app/app/src/main/AndroidManifest.xml
          grep -q 'retrobution_icon_background' winlator-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s winlator-app/app/src/main/res/drawable-nodpi/retrobution_icon_foreground.png
          test -s winlator-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Prepare persistent release signing key
        shell: bash
        env:
          RETROBUTION_KEYSTORE_BASE64: ${{ secrets.RETROBUTION_KEYSTORE_BASE64 }}
          RETROBUTION_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          RETROBUTION_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          RETROBUTION_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RETROBUTION_KEYSTORE_BASE64 RETROBUTION_KEYSTORE_PASSWORD RETROBUTION_KEY_ALIAS RETROBUTION_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the four RETROBUTION_* repository secrets before building POC4.6."
            exit 2
          fi

          SIGN_DIR="$RUNNER_TEMP/fusionfall-retrobution-signing"
          mkdir -p "$SIGN_DIR"
          KS="$SIGN_DIR/retrobution-release.jks"
          printf '%s' "$RETROBUTION_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KS"
          chmod 600 "$KS"
          test -s "$KS"
          keytool -list \
            -keystore "$KS" \
            -storepass "$RETROBUTION_KEYSTORE_PASSWORD" \
            -alias "$RETROBUTION_KEY_ALIAS" >/dev/null
          echo "FUSIONFALL_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "Release keystore loaded and alias validated."

      - name: Build signed release APK
        shell: bash
        env:
          FUSIONFALL_KEYSTORE_PASSWORD: ${{ secrets.RETROBUTION_KEYSTORE_PASSWORD }}
          FUSIONFALL_KEY_ALIAS: ${{ secrets.RETROBUTION_KEY_ALIAS }}
          FUSIONFALL_KEY_PASSWORD: ${{ secrets.RETROBUTION_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          cd winlator-app
          chmod +x gradlew
          find app/src/main/res -type f -name "*.bak.fusionfall-poc4*" -print -delete || true
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo
            echo '================ BUILD ERROR SUMMARY ================'
            grep -nEi 'error:|FAILURE:|Execution failed|Caused by:|cannot find symbol|incompatible types|expected|signing' ../build.log | tail -320 || true
            echo '====================================================='
            exit "$status"
          fi

      - name: Verify APK signature and certificate
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find winlator-app/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/FusionFall-Retrobution-POC4.6-signing.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' dist/FusionFall-Retrobution-POC4.6-signing.txt

      - name: Collect signed APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find winlator-app/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/FusionFall-Retrobution-POC4.6-signed.apk
          sha256sum dist/FusionFall-Retrobution-POC4.6-signed.apk > dist/FusionFall-Retrobution-POC4.6-signed.apk.sha256
          cat dist/FusionFall-Retrobution-POC4.6-signed.apk.sha256
          echo
          cat dist/FusionFall-Retrobution-POC4.6-signing.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FusionFall-Retrobution-POC4.6-Signed
          path: |
            dist/FusionFall-Retrobution-POC4.6-signed.apk
            dist/FusionFall-Retrobution-POC4.6-signed.apk.sha256
            dist/FusionFall-Retrobution-POC4.6-signing.txt
          if-no-files-found: error
